<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Wave Link Control - Property Inspector</title>
    <link href="../utils/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="sdpi-wrapper p-3">
        <div class="mb-3">
            <label class="form-label" for="typeSelect">Tipo</label>
            <select class="form-select" id="typeSelect">
                <option value="">Selecciona un tipo...</option>
                <option value="channel">Canal (master)</option>
                <option value="channelMix">Canal dentro de un Mix</option>
                <option value="input">Entrada</option>
                <option value="output">Salida</option>
                <option value="mix">Mix (master)</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="targetSelect">Destino</label>
            <select class="form-select" id="targetSelect">
                <option value="">Selecciona un tipo primero...</option>
            </select>
        </div>

        <div id="status" class="status">Conectando...</div>
    </div>

    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        padding: 8px;
        background-color: #2a2a2a;
        color: #fff;
    }

    /* The SDK vendors Bootstrap 5.1.3, which predates `data-bs-theme`, so its
       controls only ship in the light theme. These are the dark values Mirabox's
       own plugins render with: a field darker than the panel, a muted border and
       a light chevron. */
    .form-select {
        color: #dee2e6;
        background-color: #212529;
        border-color: #495057;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23dee2e6' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
    }

    .form-select:focus {
        color: #dee2e6;
        background-color: #212529;
        border-color: #6ea8fe;
        box-shadow: none;
    }

    .status {
        font-size: .75rem;
        color: rgba(222, 226, 230, .75);
    }

    .status.error {
        color: #ea868f;
    }

    ::-webkit-scrollbar {
        display: none;
    }
</style>

</html>

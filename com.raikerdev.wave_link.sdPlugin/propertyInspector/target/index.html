<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Wave Link Control - Property Inspector</title>
    <link href="../utils/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="sdpi-wrapper">
        <!-- Source text is English; the SDK swaps it for the host's language.
             Every string here needs a key in the Localization block of each
             language file, or it renders as "undefined". -->
        <div class="mb-1">
            <label class="form-label" for="typeSelect">Type</label>
            <select class="form-select" id="typeSelect">
                <option value="">Select a type...</option>
                <option value="channel">Channel (master)</option>
                <option value="channelMix">Channel within a Mix</option>
                <option value="input">Input</option>
                <option value="output">Output</option>
                <option value="mix">Mix (master)</option>
            </select>
        </div>

        <div class="mb-1">
            <label class="form-label" for="targetSelect">Target</label>
            <select class="form-select" id="targetSelect">
                <option value="">Select a type first...</option>
            </select>
        </div>

        <!-- Volume Button only. index.js shows the fields each action needs. -->
        <div class="mb-1" id="modeField" hidden>
            <label class="form-label" for="modeSelect">On press</label>
            <select class="form-select" id="modeSelect">
                <option value="up">Turn the volume up</option>
                <option value="down">Turn the volume down</option>
                <option value="set">Set to a value</option>
            </select>
        </div>

        <div class="mb-1" id="stepField" hidden>
            <label class="form-label" for="stepInput">Step (%)</label>
            <input class="form-control" type="number" id="stepInput" min="1" max="25" step="1">
        </div>

        <div class="mb-1" id="levelField" hidden>
            <label class="form-label" for="levelInput">Volume (%)</label>
            <input class="form-control" type="number" id="levelInput" min="0" max="100" step="1">
        </div>

        <div id="status" class="status">Connecting...</div>
    </div>

    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>

<style>
    body {
        font-family: sans-serif;
        padding: 8px;
        background-color: #2d2d2d;
        color: #fff;
    }

    /* The SDK vendors Bootstrap 5.1.3, which predates `data-bs-theme`, so its
       controls only ship in the light theme and every dark value has to be set
       here by hand.

       House style for any control added later — keep these in sync:
         panel   #2d2d2d   field    #3d3d3d   (field sits lighter than the panel)
         border  #4a4a4a   focused  #7a7a7a
         text    #dee2e6   labels   #ffffff at 12px
         radius  4px       padding  5px 10px  font 12px */

    .form-label {
        color: #ffffff;
        font-size: 12px;
        margin-bottom: 4px;
    }
    
    .form-select,
    .form-control {
        color: #dee2e6;
        background-color: #3d3d3d;
        border-color: #4a4a4a;
        border-radius: 4px;
        font-size: 12px;
        padding: 5px 10px;
    }

    .form-select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 16'%3e%3cpath fill='none' stroke='%23dee2e6' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
    }

    .form-select:focus,
    .form-control:focus {
        color: #dee2e6;
        background-color: #3d3d3d;
        border-color: #7a7a7a;
        border-width: 1px;
        box-shadow: none;
    }

    .status {
        font-size: .75rem;
        color: rgba(222, 226, 230, .75);
    }

    .status.error {
        color: #ea868f;
    }

    ::-webkit-scrollbar {
        display: none;
    }
</style>

</html>
